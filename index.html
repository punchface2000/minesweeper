<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f5f0e6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Minesweeper" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <title>Minesweeper</title>
</head>
<body>
  <div id="app">
    <header class="masthead">
      <h1>Mine<i>sweeper</i></h1>
      <div class="issue mono"><span id="edition"></span><br><span id="today"></span></div>
    </header>

    <div class="stats">
      <div class="stat"><span class="mono">Mines left</span><b id="mines">10</b></div>
      <div class="stat"><span class="mono">Time</span><b id="time">0:00</b></div>
      <button id="new" class="stat new"><span>New game</span></button>
    </div>

    <main class="board-wrap">
      <div class="board-frame">
        <div id="board" class="board" role="grid"></div>
        <div id="stamp" class="stamp" hidden><span>Solved</span></div>
      </div>
      <button id="fit" class="fit mono" hidden>Fit board</button>
    </main>

    <footer class="bottom">
      <nav class="tabs" id="difficulty" role="tablist">
        <button data-d="beginner">Easy</button>
        <button data-d="intermediate">Medium</button>
        <button data-d="expert">Hard</button>
        <button data-d="custom">Custom</button>
        <span class="underline" aria-hidden="true"></span>
      </nav>
      <div class="foot">
        <button id="mode" class="mode" aria-pressed="false"><span class="dig">Dig</span><span class="flag">Flag</span></button>
        <div class="links">
          <button id="best">Records</button>
          <button id="settings">Settings</button>
        </div>
      </div>
    </footer>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-card">
        <h2 id="sheet-title"></h2>
        <div id="sheet-body"></div>
        <button id="sheet-close" class="primary">OK</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
